[project]
name = "hackalem-org-review"
version = "0.1.0"
description = "Evidence-linked review of organizational changes"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "openai>=2.0,<3",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
