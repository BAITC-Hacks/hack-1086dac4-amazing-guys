<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка функций до / после</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;background:#f4f6f8;color:#172534;margin:0}main{max-width:1050px;margin:35px auto;padding:24px}h1{font-size:30px}section,article{background:white;padding:22px;margin:16px 0;border:1px solid #d9e1e8;border-radius:12px}.row{display:flex;gap:24px;flex-wrap:wrap}.row label{flex:1;min-width:260px}input{display:block;margin:12px 0}button{background:#174b69;color:white;border:0;padding:10px 17px;border-radius:6px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.source{background:#eaf1f6;color:#17394c;margin:5px}.muted{color:#596d7c}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status[role=alert]{color:#982626}dialog{max-width:800px;max-height:80vh;border:1px solid #bccbd6;border-radius:12px}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #dae3eb;text-align:left;vertical-align:top}.badge{font-size:13px;color:#596d7c}
</style>
<main><p class="muted">Анализ организационных изменений · первая версия</p><h1>Кому перешли функции?</h1><p>Загрузите документы до и после реорганизации. Выводы рекомендательные: проверяйте их по исходным пунктам.</p>
<section><form id="upload"><div class="row"><label>До реорганизации<input type="file" name="before_files" multiple required accept=".docx,.xlsx,.pdf,.txt,.md"></label><label>После реорганизации<input type="file" name="after_files" multiple required accept=".docx,.xlsx,.pdf,.txt,.md"></label></div><p class="muted">До 5 файлов на комплект, до 5 МБ каждый. PDF должен содержать текст.</p><button id="start">Сравнить документы</button></form><p id="status" aria-live="polite"></p></section>
<div id="report"></div><dialog id="source"><button id="close">Закрыть</button><h2 id="sourceTitle"></h2><p id="sourceLocation"></p><pre id="sourceText"></pre></dialog>
</main><script>
const $=s=>document.querySelector(s);let analysisId=null;
const names={possible_loss:'Возможная потеря функции',possible_duplication:'Возможное дублирование',potential_conflict:'Потенциальный конфликт',insufficient_evidence:'Недостаточно данных'};
const stages={queued:'В очереди',extracting:'Читаем документы',matching:'Сопоставляем функции',verifying:'Проверяем соответствия и источники',reporting:'Формируем заключение'};
function el(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
async function request(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw new Error(data.error?.message||'Не удалось выполнить запрос');return data}
function status(text,error=false){$('#status').textContent=text;$('#status').setAttribute('role',error?'alert':'status')}
function evidenceButtons(ids,parent){for(const id of ids){const b=el('button','Источник '+id,parent);b.className='source';b.type='button';b.onclick=()=>openSource(id)}}
async function openSource(id){try{const e=await request(`/api/analyses/${analysisId}/evidence/${encodeURIComponent(id)}`);$('#sourceTitle').textContent=e.document_name+' · '+(e.version==='before'?'до':'после');$('#sourceLocation').textContent=Object.entries(e.locator).filter(([k,v])=>v!==null&&k!=='kind').map(([k,v])=>k+': '+v).join(' · ');$('#sourceText').textContent=e.quote+(e.context?'\n\nКонтекст:\n'+e.context:'');$('#source').showModal()}catch(e){status(e.message,true)}}
function render(r){const root=$('#report');root.replaceChildren();const intro=el('section','',root);el('h2','Заключение',intro);el('p',r.conclusion.summary,intro);el('p',r.coverage.status==='partial'?'Часть комплекта не прочитана — анализ неполный.':'Анализ выполнен по прочитанным документам.',intro);for(const text of [...r.coverage.limitations,...r.conclusion.limitations])el('p',text,intro).className='muted';for(const d of r.documents)for(const w of d.warnings)el('p',d.name+': '+w,intro);
const units=el('section','',root);el('h2','Изменения подразделений',units);for(const u of r.unit_changes){el('p',u.explanation,units);evidenceButtons(u.evidence_ids,units)}
const matrix=el('section','',root);el('h2','Функции до → после',matrix);const funcs=Object.fromEntries(r.functions.map(f=>[f.id,f]));for(const m of r.function_matches){const a=el('article','',matrix);el('p',m.explanation,a);el('p','До: '+m.before_function_ids.map(id=>funcs[id]?.unit_id+': '+funcs[id]?.action+' '+funcs[id]?.object).join('; '),a);el('p','После: '+(m.after_function_ids.map(id=>funcs[id]?.unit_id+': '+funcs[id]?.action+' '+funcs[id]?.object).join('; ')||'Соответствие не установлено'),a);evidenceButtons(m.evidence_ids,a)}
const risks=el('section','',root);el('h2','Замечания для проверки',risks);if(!r.findings.length)el('p','Замечаний не найдено. Это не гарантирует отсутствие всех рисков.',risks);for(const f of r.findings){const a=el('article','',risks);el('span',(names[f.type]||f.type)+' · не проверено сотрудником',a).className='badge';el('h3',f.title,a);el('p',f.explanation,a);for(const l of f.limitations)el('p',l,a).className='muted';evidenceButtons(f.evidence_ids,a)}
for(const rec of r.conclusion.recommendations){const a=el('article','',root);el('p',rec.text,a);evidenceButtons(rec.evidence_ids,a)}}
$('#close').onclick=()=>$('#source').close();$('#upload').onsubmit=async e=>{e.preventDefault();$('#start').disabled=true;$('#report').replaceChildren();status('Загружаем документы');try{const created=await request('/api/analyses',{method:'POST',body:new FormData(e.target),headers:{'Idempotency-Key':crypto.randomUUID()}});analysisId=created.analysis_id;let done=false;for(let i=0;i<150;i++){const s=await request('/api/analyses/'+analysisId);status(stages[s.stage]||s.status);if(s.status==='failed')throw new Error(s.error?.message||'Анализ не завершён');if(s.status==='completed'){render(await request('/api/analyses/'+analysisId+'/report'));status('Готово. Проверьте замечания по источникам.');done=true;break}await new Promise(resolve=>setTimeout(resolve,1500))}if(!done)status('Обработка занимает больше времени. Состояние сохранено на сервере.',true)}catch(err){status(err.message,true)}finally{$('#start').disabled=false}};
request('/api/health').then(h=>{if(!h.model_configured)status('Для AI-анализа нужно настроить ключ на сервере.',true)}).catch(()=>status('Сервер недоступен.',true));
</script></html>
